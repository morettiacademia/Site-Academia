# Publica o site no GitHub Pages a cada mudança (inclusive artigos salvos
# pelo painel do blog). Configuração em docs/PUBLICAR-O-SITE.md.
name: Publicar o site

on:
  push:
    branches: [main, claude/new-session-mul9z7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar o site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://academiadamagia.com.br' }}
          PUBLIC_WHATSAPP_NUMERO: ${{ vars.PUBLIC_WHATSAPP_NUMERO }}
          PUBLIC_ACADEMIA365_URL: ${{ vars.PUBLIC_ACADEMIA365_URL }}
          PUBLIC_INSTAGRAM_URL: ${{ vars.PUBLIC_INSTAGRAM_URL }}
          PUBLIC_YOUTUBE_URL: ${{ vars.PUBLIC_YOUTUBE_URL }}
          PUBLIC_PODCAST_URL: ${{ vars.PUBLIC_PODCAST_URL }}
          PUBLIC_PROTAGONISTAS_URL: ${{ vars.PUBLIC_PROTAGONISTAS_URL }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
